<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b14">
  <title>Dungeon Cards</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="mute" aria-label="Sound">🔊</button>

  <!-- TITLE -->
  <section id="screen-title" class="screen">
    <img class="cover" src="assets/img/cover.jpg" alt="" onerror="this.style.display='none'">
    <h1>DUNGEON CARDS</h1>
    <p class="tag">A tactical roguelite card crawler. One energy pool for attack AND defense, multiple enemies, statuses & distance. Pick a class, build a loadout, beat the dungeon.</p>
    <button id="btn-start" class="primary">Start adventure</button>
  </section>

  <!-- CLASS SELECT -->
  <section id="screen-class" class="screen hidden">
    <h2>Choose your hero</h2>
    <div id="class-cards" class="class-cards"></div>
  </section>

  <!-- LOADOUT -->
  <section id="screen-loadout" class="screen hidden">
    <h2 id="loadout-title">Build your loadout</h2>
    <div id="loadout-body" class="loadout"></div>
    <button id="loadout-start" class="primary">Enter the dungeon</button>
  </section>

  <!-- MAP -->
  <section id="screen-map" class="screen hidden">
    <div class="topbar"><span id="map-hp">❤️</span><span id="map-gold">🪙</span><span id="map-deck">🃏</span></div>
    <div id="map-rooms" class="rooms"></div>
  </section>

  <!-- COMBAT -->
  <section id="screen-combat" class="screen hidden">
    <div id="enemy-area" class="enemy-area"></div>
    <div id="player-stats" class="player-stats"></div>
    <div class="combat-bar">
      <span class="pile">🂠 <i id="draw-count">0</i></span>
      <button id="bag" class="secondary hidden">Bag</button>
      <button id="mulligan" class="secondary hidden">Mulligan ⟳</button>
      <button id="phase-btn" class="primary">End Turn ▶</button>
      <span class="pile">🗑 <i id="discard-count">0</i></span>
    </div>
    <div id="hand" class="hand"></div>
  </section>

  <!-- EVENT -->
  <section id="screen-event" class="screen hidden">
    <div id="event-icon" class="event-icon">🔥</div>
    <h2 id="event-title"></h2>
    <p id="event-text" class="tag"></p>
    <div id="event-cards" class="card-row"></div>
    <button id="event-continue" class="primary">Continue</button>
  </section>

  <!-- END -->
  <section id="screen-end" class="screen hidden">
    <div id="end-emoji" class="event-icon">☠️</div>
    <h2 id="end-title"></h2>
    <p id="end-text" class="tag"></p>
    <button id="btn-restart" class="primary">New adventure</button>
  </section>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
