<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0710">
  <title>Castle Survivors</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="rotate"><div class="rot-icon">📱↻</div><p>Rotate to landscape</p></div>

  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="xp-bar"><div id="xp-fill"></div></div>
    <div class="hud-row">
      <div class="hud-bars">
        <div class="hb">🏰 <div class="bar2"><div id="castle-fill"></div></div></div>
        <div class="hb">❤️ <div class="bar2 hp"><div id="hp-fill"></div></div></div>
      </div>
      <div id="timer">0:00</div>
      <div class="hud-right"><span id="lvl">Lv 1</span><span id="kills">☠ 0</span></div>
    </div>
  </div>

  <!-- virtual joystick -->
  <div id="joystick" class="hidden"><div id="joynub"></div></div>
  <button id="mute" aria-label="Sound">🔊</button>

  <!-- TITLE -->
  <section id="screen-title" class="overlay">
    <img id="cover-img" class="cover" alt="" onerror="this.style.display='none'">
    <h1>CASTLE<br>SURVIVORS</h1>
    <p class="tag">Defend the castle from endless hordes. Move to fight, weapons auto-attack, collect XP and level up. How long can you hold?</p>
    <button id="btn-start" class="primary">Defend!</button>
  </section>

  <!-- LEVEL UP -->
  <section id="levelup" class="overlay hidden">
    <h2>LEVEL UP</h2>
    <div id="lu-cards" class="lu-cards"></div>
  </section>

  <!-- GAME OVER -->
  <section id="gameover" class="overlay hidden">
    <h2>THE CASTLE HAS FALLEN</h2>
    <p id="go-stats" class="tag"></p>
    <button id="btn-again" class="primary">Defend again</button>
  </section>

  <div id="crt"></div>
  <script type="module" src="js/main.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
