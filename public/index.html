<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10141c">
  <title>Ashen Vale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="bars">
      <div class="bar hp"><i></i><div id="hp-fill"></div></div>
      <div class="bar st"><i></i><div id="st-fill"></div></div>
    </div>
    <div id="objective">Foes <b id="foes">0</b></div>
  </div>

  <!-- TOUCH CONTROLS -->
  <div id="touch" class="hidden">
    <div id="stick"><div id="stick-nub"></div></div>
    <div id="buttons">
      <button id="btn-roll" class="action" aria-label="Dodge">⟳</button>
      <button id="btn-attack" class="action big" aria-label="Attack">⚔</button>
    </div>
  </div>

  <button id="mute" aria-label="Sound">🔊</button>

  <!-- TITLE -->
  <section id="screen-title" class="overlay">
    <h1>ASHEN<br>VALE</h1>
    <p class="tag">A lone wanderer in a forgotten vale. Move with the left stick, swipe the right side to look around, and strike down what stirs in the mist. Rest at the golden tree to heal.</p>
    <button id="btn-start" class="primary">Enter the Vale</button>
    <p class="hint">Headphones recommended · tap to begin</p>
  </section>

  <!-- DEATH -->
  <section id="death" class="overlay hidden">
    <h2>YOU DIED</h2>
    <p id="death-stats" class="tag"></p>
    <button id="btn-respawn" class="primary">Rise again</button>
  </section>

  <div id="toast"></div>

  <script type="module" src="js/main.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
